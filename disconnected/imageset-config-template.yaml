# ─────────────────────────────────────────────────────────────────────────────
# ImageSetConfiguration Template for oc-mirror
# ─────────────────────────────────────────────────────────────────────────────
# This template mirrors:
#   1. The RHOAI operator from the Red Hat operator index
#   2. Workload images used by this GitOps repository
#
# Before using:
#   1. Replace MIRROR_REGISTRY with your private registry URL
#   2. Adjust OCP_VERSION to match your OpenShift version
#   3. Set RHOAI_CHANNEL and RHOAI_VERSION for your target release
#   4. Merge additionalImages from the official RHOAI disconnected helper:
#      https://github.com/red-hat-data-services/rhoai-disconnected-install-helper
#
# Usage:
#   oc mirror --config=disconnected/imageset-config-template.yaml \
#     docker://MIRROR_REGISTRY
# ─────────────────────────────────────────────────────────────────────────────
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  # ── RHOAI Operator (OLM catalog) ──────────────────────────────────────────
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20  # Match your OCP version
      packages:
        - name: rhods-operator
          channels:
            - name: fast            # fast = GA, beta = EA, stable = LTS
              # Uncomment to pin a specific version:
              # minVersion: "3.5.0"
              # maxVersion: "3.5.0"

  # ── Workload Images ───────────────────────────────────────────────────────
  # These are container images referenced in the GitOps manifests
  # (components/instances/ and usecases/). They are NOT part of the
  # RHOAI operator catalog and must be mirrored separately.
  additionalImages:
    # OpenShift CLI (used by PostSync hooks and CronJobs)
    - name: registry.redhat.io/openshift4/ose-cli:v4.18
    # NFD discovery image
    - name: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.20

    # PostgreSQL databases
    - name: registry.redhat.io/rhel9/postgresql-15:1
    - name: registry.redhat.io/rhel9/postgresql-16:1

    # vLLM model serving runtimes
    - name: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.0

    # Guardrails and inference components (digest-pinned)
    - name: registry.redhat.io/rhoai/odh-trustyai-vllm-orchestrator-gateway-rhel9@sha256:0b99cdc8e4ee57751cbe2298cd13853fbf79b882353057542250ee29d451f78b
    - name: registry.redhat.io/rhoai/odh-llm-d-inference-scheduler-rhel9@sha256:bddf686d6eaf1a607e1c697f58165d685944607cb4629648f27e56b2884e3de0
    - name: registry.redhat.io/rhaiis/vllm-cpu-rhel9@sha256:f05e773647dddd37ec6c2215cb14bec87e4ab5a7d37f2e110d16cd92355427d3

    # RHOKP (Knowledge Platform)
    - name: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:1

    # UBI Python (download jobs, orchestrator proxy, UI)
    - name: registry.access.redhat.com/ubi9/python-311:1

    # OKP MCP server
    - name: quay.io/redhat-user-workloads/rhel-lightspeed-tenant/okp-mcp:1

    # NVIDIA PyTorch (training workloads)
    - name: nvcr.io/nvidia/pytorch:24.08-py3

    # GenAI Toolbox
    - name: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:0.28.0

    # Vault (dev-only)
    - name: docker.io/hashicorp/vault:1.17

    # ── RHOAI Platform Images ──────────────────────────────────────────────
    # IMPORTANT: Copy the additionalImages from the RHOAI disconnected
    # install helper for your specific version:
    #   https://github.com/red-hat-data-services/rhoai-disconnected-install-helper
    #
    # These include notebooks, pipeline runtimes, Ray, model serving
    # components, and other images managed by the RHOAI operator that
    # are not in the OLM catalog.
    #
    # Example (from rhoai-3.5.md):
    # - name: registry.redhat.io/rhoai/odh-workbench-jupyter-minimal-cpu-py312-rhel9@sha256:...
    # - name: quay.io/modh/ray@sha256:...
