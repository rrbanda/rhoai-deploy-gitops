apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: models
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-only
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
        revision: main
        files:
          - path: models-v2/*/config.json
      selector:
        matchLabels:
          enabled: "true"
  template:
    metadata:
      name: 'model-{{ .name }}'
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "10"
        rhoai.redhat.com/description: '{{ .description }}'
      labels:
        app.kubernetes.io/part-of: rhoai-gitops
        rhoai.redhat.com/category: model
        rhoai.redhat.com/wave: "10"
    spec:
      project: platform
      source:
        repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
        targetRevision: main
        path: 'models-v2/{{ .name }}/manifests'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        - group: serving.kserve.io
          kind: InferenceService
          jsonPointers:
            - /status
            - /metadata/annotations
        - group: serving.kserve.io
          kind: ServingRuntime
          jsonPointers:
            - /status
        - group: route.openshift.io
          kind: Route
          jsonPointers:
            - /spec/host
            - /status
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 60s
            maxDuration: 10m0s
            factor: 2
