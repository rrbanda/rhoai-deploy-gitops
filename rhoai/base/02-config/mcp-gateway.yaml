apiVersion: v1
kind: Namespace
metadata:
  name: mcp-system
  annotations:
    openshift.io/display-name: "MCP Gateway"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocp-mcp-server
  annotations:
    openshift.io/display-name: "MCP Server"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: mcp-system
  annotations:
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: openshift-ai-inference
  listeners:
    - name: mcp
      port: 8001
      protocol: HTTP
      hostname: REPLACE_WITH_MCP_GATEWAY_HOSTNAME
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
# Alias service: MCP Gateway controller hardcodes "-istio" suffix for
# internal broker→gateway connectivity, but openshift-ai-inference class
# creates a service named "<gw>-openshift-ai-inference".
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway-istio
  namespace: mcp-system
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: mcp-gateway
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
