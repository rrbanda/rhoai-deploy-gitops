apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-mcp-guardrails
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: rhoai-platform
  source:
    repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
    targetRevision: helm-deploy-v3.5
    path: rhoai/base/06-mcp-guardrails
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
