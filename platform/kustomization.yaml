apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Wave 0: Foundation (cert-manager, NFD, Pipelines, JobSet, KEDA)
  - wave-0-foundation/cert-manager.yaml
  - wave-0-foundation/nfd.yaml
  - wave-0-foundation/jobset.yaml
  - wave-0-foundation/keda.yaml
  # Wave 1: Infrastructure (LWS, Kueue, GPU, ServiceMesh)
  - wave-1-infrastructure/lws.yaml
  - wave-1-infrastructure/kueue.yaml
  - wave-1-infrastructure/gpu.yaml
  - wave-1-infrastructure/servicemesh.yaml
  # Wave 2: Networking (RHCL/Kuadrant)
  - wave-2-networking/rhcl.yaml
  # Wave 3: RHOAI Operator
  - wave-3-rhoai/openshift-ai.yaml
  # Wave 4: RHOAI Configuration (DSC)
  - wave-4-configuration/datasciencecluster.yaml
  # Wave 5: Platform Instances
  - wave-5-instances/kueue-config.yaml
  - wave-5-instances/hardware-profiles.yaml
  - wave-5-instances/mlflow.yaml
  - wave-5-instances/monitoring.yaml
  - wave-5-instances/cluster-autoscaler.yaml
  # Models ApplicationSet (wave 10, self-service)
  - models-applicationset.yaml
  - wave-5-instances/pipelines.yaml
