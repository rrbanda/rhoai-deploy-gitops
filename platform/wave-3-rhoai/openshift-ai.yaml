apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-openshift-ai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: rhoai-gitops
    rhoai.redhat.com/wave: "3"
    rhoai.redhat.com/category: core
spec:
  project: platform
  source:
    repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
    targetRevision: main
    path: operators-v2/openshift-ai/overlays/stable
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 60s
        maxDuration: 10m0s
        factor: 2
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /spec/startingCSV
        - /status
