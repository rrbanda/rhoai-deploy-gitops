apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-datasciencecluster
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/part-of: rhoai-gitops
    rhoai.redhat.com/wave: "4"
    rhoai.redhat.com/category: configuration
spec:
  project: platform
  source:
    repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
    targetRevision: main
    path: instances-v2/datasciencecluster/overlays/full
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - Replace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 60s
        maxDuration: 10m0s
        factor: 2
  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /status
        - /metadata/managedFields
    - group: dscinitialization.opendatahub.io
      kind: DSCInitialization
      jsonPointers:
        - /status
        - /metadata/managedFields
