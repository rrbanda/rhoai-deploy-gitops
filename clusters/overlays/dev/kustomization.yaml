apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - bootstrap-app.yaml
  - rhoai-instance-app.yaml
  - cluster-config.yaml

replacements:
  - source:
      kind: ConfigMap
      name: cluster-gitops-config
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
      - select:
          kind: AppProject
        fieldPaths:
          - spec.sourceRepos.0

  - source:
      kind: ConfigMap
      name: cluster-gitops-config
      fieldPath: data.targetRevision
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.generators.0.git.revision
          - spec.template.spec.source.targetRevision
