apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: instance-rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
    targetRevision: rhoai-3.4-ea2
    path: components/instances/rhoai-instance/overlays/maas
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /status
        - /metadata/annotations
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 60s
        maxDuration: 10m0s
        factor: 2
