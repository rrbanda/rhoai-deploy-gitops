apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-gitops-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
data:
  # ──────────────────────────────────────────────────────────────────────────────
  # CLUSTER CONFIGURATION — THE ONLY FILE YOU NEED TO EDIT
  # ──────────────────────────────────────────────────────────────────────────────
  # After forking this repo, update the values below and push. Then deploy:
  #
  #   until oc apply -k bootstrap/overlays/default; do sleep 10; done
  #
  # That single command installs the GitOps operator, configures ArgoCD, and
  # bootstraps the entire RHOAI platform. Everything else is automatic.
  # ──────────────────────────────────────────────────────────────────────────────

  # Your fork's Git repository URL (REQUIRED — update after forking)
  repoURL: "https://github.com/YOUR-ORG/rhoai-deploy-gitops.git"

  # Git revision to track (branch name, tag, or commit SHA)
  targetRevision: "main"

  # RHOAI operator OLM channel
  # Options: "fast" (latest GA), "beta" (EA/preview), "stable" (LTS)
  # NOTE: To change the channel, also update:
  #   components/operators/rhoai-operator/patch-channel.yaml
  # Or use: ./scripts/configure.sh --repo <url> --channel <channel>
  rhoaiChannel: "fast"

  # DataScienceCluster overlay to deploy (injected into rhoai-dsc Application)
  # Options: "minimal", "serving", "training", "full", "dev", "maas"
  # See components/instances/rhoai-instance/overlays/ for details
  rhoaiOverlay: "full"
