apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  kustomizeBuildOptions: --enable-helm --enable-alpha-plugins
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    route:
      enabled: true
      tls:
        termination: reencrypt
    service:
      type: ""
  applicationSet:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  controller:
    resources:
      limits:
        cpu: "4"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
  repo:
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
  redis:
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  resourceExclusions: |
    - apiGroups:
        - tekton.dev
      clusters:
        - '*'
      kinds:
        - TaskRun
        - PipelineRun
  resourceHealthChecks:
    - group: argoproj.io
      kind: Application
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for DSC to reconcile"
        if obj.status ~= nil then
          if obj.status.phase ~= nil then
            if obj.status.phase == "Ready" then
              hs.status = "Healthy"
              hs.message = "DSC is ready"
            elseif obj.status.phase == "Error" then
              hs.status = "Degraded"
              hs.message = "DSC encountered an error"
              if obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" and condition.message ~= nil then
                    hs.message = condition.message
                    break
                  end
                end
              end
            end
          end
        end
        return hs
    - group: serving.kserve.io
      kind: InferenceService
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for InferenceService"
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" then
                if condition.status == "True" then
                  hs.status = "Healthy"
                  hs.message = "InferenceService is ready"
                elseif condition.status == "False" then
                  hs.status = "Degraded"
                  hs.message = condition.message or "InferenceService not ready"
                end
                break
              end
            end
          end
        end
        return hs
    - group: nvidia.com
      kind: ClusterPolicy
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for GPU ClusterPolicy"
        if obj.status ~= nil then
          if obj.status.state ~= nil then
            if obj.status.state == "ready" then
              hs.status = "Healthy"
              hs.message = "GPU drivers installed"
            elseif obj.status.state == "notReady" then
              hs.status = "Progressing"
              hs.message = "GPU drivers installing"
            elseif obj.status.state == "error" then
              hs.status = "Degraded"
              hs.message = "GPU driver installation failed"
            end
          end
        end
        return hs
