apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─────────────────────────────────────────────────────────────────────────────
# Bootstrap Overlay: disconnected
# ─────────────────────────────────────────────────────────────────────────────
# For air-gapped / disconnected environments. Inherits everything from the
# default overlay. Before deploying:
#
#   1. Mirror images:  ./scripts/mirror-images.sh mirror --target-registry <registry>
#   2. Configure:      ./scripts/configure.sh --repo <url> --overlay disconnected
#   3. Deploy:         until oc apply -k bootstrap/overlays/disconnected; do sleep 10; done
#
# Prerequisites:
#   - oc-mirror has been run with the ImageSetConfiguration
#   - IDMS/ITMS and CatalogSource from oc-mirror output applied to the cluster
#   - All workload images mirrored to private registry
#
# See docs/disconnected.md for the full guide.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  # Inherit the complete bootstrap from default overlay
  - ../../base

  # ArgoCD instance (same as default)
  - ../default/argocd-instance.yaml

  # Disconnected-specific cluster configuration
  - cluster-config.yaml

  # ArgoCD Projects
  - ../../../components/argocd/projects

  # ApplicationSets (auto-discovery)
  - ../../../components/argocd/applicationsets

  # Standalone Applications (DSC)
  - ../../../components/argocd/apps

  # Self-management
  - ../default/gitops-controller.yaml

# Kustomize Replacements — same as default overlay
replacements:
  - source:
      kind: ConfigMap
      name: cluster-gitops-config
      fieldPath: data.repoURL
    targets:
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: AppProject
          name: platform
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: AppProject
          name: usecases
        fieldPaths:
          - spec.sourceRepos.0

  - source:
      kind: ConfigMap
      name: cluster-gitops-config
      fieldPath: data.targetRevision
    targets:
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.generators.0.git.revision
          - spec.template.spec.source.targetRevision
      - select:
          kind: Application
        fieldPaths:
          - spec.source.targetRevision

  - source:
      kind: ConfigMap
      name: cluster-gitops-config
      fieldPath: data.rhoaiOverlay
    targets:
      - select:
          kind: Application
          name: rhoai-dsc
        fieldPaths:
          - spec.source.path
        options:
          delimiter: "/"
          index: 4
