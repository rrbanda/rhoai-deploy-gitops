apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-gitops-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
data:
  # ──────────────────────────────────────────────────────────────────────────────
  # DISCONNECTED CLUSTER CONFIGURATION
  # ──────────────────────────────────────────────────────────────────────────────
  # For air-gapped / disconnected environments where the cluster cannot reach
  # public container registries. All images must be pre-mirrored to your
  # private registry using scripts/mirror-images.sh and oc-mirror.
  #
  # See docs/disconnected.md for the full deployment guide.
  # ──────────────────────────────────────────────────────────────────────────────

  # Your fork's Git repository URL (REQUIRED)
  repoURL: "https://github.com/YOUR-ORG/rhoai-deploy-gitops.git"

  # Git revision to track
  targetRevision: "main"

  # RHOAI operator OLM channel
  rhoaiChannel: "fast"

  # DataScienceCluster overlay
  rhoaiOverlay: "full"
