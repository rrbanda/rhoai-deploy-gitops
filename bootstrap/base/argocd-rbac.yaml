apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-cluster-admin
  annotations:
    # cluster-admin is required because ArgoCD must create/manage:
    #   - OLM Subscriptions and OperatorGroups (operators.coreos.com)
    #   - Cluster-scoped CRs: ClusterPolicy, NodeFeatureDiscovery,
    #     DataScienceCluster, Kueue, ClusterQueue, etc.
    #   - ClusterRoles/ClusterRoleBindings for operator RBAC
    #   - Namespaces across the cluster
    # A narrower role would require enumerating every CRD the platform uses,
    # including those created dynamically by OLM-installed operators.
    security.rhoai.redhat.com/rationale: "Required for full platform lifecycle management"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
