apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml

patches:
  - target:
      kind: Subscription
      name: kueue-operator
    path: patch-channel.yaml
  - target:
      kind: Subscription
      name: kueue-operator
    path: patch-source.yaml
  # Uncomment to override OperatorGroup name (for brownfield adoption):
  # - target:
  #     kind: OperatorGroup
  #     name: kueue-operator
  #   path: patch-operatorgroup-name.yaml
