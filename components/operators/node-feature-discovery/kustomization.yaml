apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../vendor/gitops-catalog/nfd

patches:
  - target:
      kind: Subscription
      name: nfd
    path: patch-channel.yaml
  - target:
      kind: Subscription
      name: nfd
    path: patch-source.yaml
  # Uncomment to override OperatorGroup name (for brownfield adoption):
  # - target:
  #     kind: OperatorGroup
  #     name: nfd-group
  #   path: patch-operatorgroup-name.yaml
