apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: usecases
  namespace: openshift-gitops
spec:
  description: >-
    AI use case applications (models and services) deployed on RHOAI.
    Restricted to Namespace creation for cluster resources. Namespace
    destinations are broad because model/service namespaces vary per
    deployment.
  sourceRepos:
    - REPO_URL_PLACEHOLDER
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
