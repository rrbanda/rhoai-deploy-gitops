apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: openshift-gitops
spec:
  description: >-
    RHOAI platform operators and instances. Requires broad permissions because
    it creates OLM Subscriptions, cluster-scoped CRs (ClusterPolicy,
    NodeFeatureDiscovery, DataScienceCluster), ClusterRoles, and namespaces
    across multiple operator namespaces.
  sourceRepos:
    - REPO_URL_PLACEHOLDER
    - https://github.com/redhat-cop/gitops-catalog.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
