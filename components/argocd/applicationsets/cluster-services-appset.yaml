apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-services
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: REPO_URL_PLACEHOLDER
        revision: TARGET_REVISION_PLACEHOLDER
        files:
          - path: usecases/services/*/profiles/tier1-minimal/config.json
      # Only deploy services where config.json has "enabled": "true"
      # To enable a service, edit its config.json and set enabled to "true"
      selector:
        matchLabels:
          enabled: "true"
  template:
    metadata:
      name: 'service-{{ .name }}'
      namespace: openshift-gitops
      labels:
        app.kubernetes.io/part-of: rhoai-services
        rhoai.redhat.com/category: '{{ .category }}'
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        rhoai.redhat.com/description: '{{ .description }}'
    spec:
      project: usecases
      source:
        repoURL: REPO_URL_PLACEHOLDER
        targetRevision: TARGET_REVISION_PLACEHOLDER
        path: '{{ .path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        - group: serving.kserve.io
          kind: InferenceService
          jsonPointers:
            - /status
            - /metadata/annotations
        - group: serving.kserve.io
          kind: ServingRuntime
          jsonPointers:
            - /status
        - group: route.openshift.io
          kind: Route
          jsonPointers:
            - /spec/host
            - /status
        - group: ""
          kind: Secret
          jsonPointers:
            - /data
            - /stringData
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 60s
            maxDuration: 10m0s
            factor: 2
