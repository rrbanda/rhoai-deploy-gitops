apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-operators
  namespace: openshift-gitops
spec:
  goTemplate: true
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: REPO_URL_PLACEHOLDER
        revision: TARGET_REVISION_PLACEHOLDER
        directories:
          - path: components/operators/*
          # GPU operator uses gitops-catalog (external kustomize base)
          - path: components/operators/gpu-operator
            exclude: true
  template:
    metadata:
      name: 'operator-{{ .path.basename }}'
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      labels:
        app.kubernetes.io/part-of: rhoai-gitops
        app.kubernetes.io/component: operator
    spec:
      project: platform
      source:
        repoURL: REPO_URL_PLACEHOLDER
        targetRevision: TARGET_REVISION_PLACEHOLDER
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
      ignoreDifferences:
        - group: operators.coreos.com
          kind: Subscription
          jsonPointers:
            - /spec/startingCSV
            - /status
            - /metadata/annotations
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            maxDuration: 5m0s
            factor: 2
