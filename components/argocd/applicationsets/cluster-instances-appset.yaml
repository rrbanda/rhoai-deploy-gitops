apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-instances
  namespace: openshift-gitops
spec:
  goTemplate: true
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: REPO_URL_PLACEHOLDER
        revision: TARGET_REVISION_PLACEHOLDER
        directories:
          - path: components/instances/*
          # DSC is managed by a dedicated Application (rhoai-dsc-app.yaml)
          - path: components/instances/rhoai-instance
            exclude: true
          # GPU operator instance uses gitops-catalog external base
          - path: components/instances/gpu-instance
            exclude: true
          # GPU MachineSets are cluster-specific — see gpu-workers/README.md
          - path: components/instances/gpu-workers
            exclude: true
          # OIDC integration requires cluster-specific Keycloak URLs — disabled
          # by default. To enable: update authconfig.yaml with your IdP, then
          # remove or comment out this exclude rule.
          - path: components/instances/oidc-integration
            exclude: true
          # vault-dev is for development only — excluded in favor of vault-server
          - path: components/instances/vault-dev
            exclude: true
          # EvalHub CRD not available in RHOAI 3.5 EA2
          - path: components/instances/evalhub
            exclude: true
          # MaaS gateway requires external DNS delegation for TLS cert validation
          - path: components/instances/maas-gateway
            exclude: true
          # Optional: uncomment to exclude components not needed in your env
          # - path: components/instances/observability
          #   exclude: true
  template:
    metadata:
      name: 'instance-{{ .path.basename }}'
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      labels:
        app.kubernetes.io/part-of: rhoai-gitops
        app.kubernetes.io/component: instance
    spec:
      project: platform
      source:
        repoURL: REPO_URL_PLACEHOLDER
        targetRevision: TARGET_REVISION_PLACEHOLDER
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
      ignoreDifferences:
        - group: nvidia.com
          kind: ClusterPolicy
          jsonPointers:
            - /status
        - group: nfd.openshift.io
          kind: NodeFeatureDiscovery
          jsonPointers:
            - /status
        - group: kueue.x-k8s.io
          kind: ClusterQueue
          jsonPointers:
            - /spec/queueingStrategy
            - /spec/fairSharing
        - group: ""
          kind: Secret
          jsonPointers:
            - /data
            - /stringData
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/podManagementPolicy
            - /spec/revisionHistoryLimit
            - /spec/template/spec/containers/0/terminationMessagePath
            - /spec/template/spec/containers/0/terminationMessagePolicy
            - /spec/template/spec/dnsPolicy
            - /spec/template/spec/schedulerName
            - /spec/template/spec/terminationGracePeriodSeconds
            - /spec/volumeClaimTemplates/0/status
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /status
            - /spec/target
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 60s
            maxDuration: 10m0s
            factor: 2
