apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-dsc
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: rhoai-gitops
    app.kubernetes.io/component: datasciencecluster
spec:
  project: platform
  source:
    repoURL: REPO_URL_PLACEHOLDER
    targetRevision: TARGET_REVISION_PLACEHOLDER
    path: components/instances/rhoai-instance/overlays/full
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - Replace=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m0s
        factor: 2
