apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-models
  namespace: openshift-gitops
spec:
  goTemplate: true
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: REPO_URL_PLACEHOLDER
        revision: TARGET_REVISION_PLACEHOLDER
        directories:
          - path: usecases/models/*/profiles/tier1-minimal
  template:
    metadata:
      name: 'model-{{ index .path.segments 2 }}'
      namespace: openshift-gitops
    spec:
      project: usecases
      source:
        repoURL: REPO_URL_PLACEHOLDER
        targetRevision: TARGET_REVISION_PLACEHOLDER
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
      ignoreDifferences:
        - group: serving.kserve.io
          kind: InferenceService
          jsonPointers:
            - /status
            - /metadata/annotations
        - group: serving.kserve.io
          kind: LLMInferenceService
          jsonPointers:
            - /status
            - /metadata/annotations
            - /metadata/finalizers
        - group: serving.kserve.io
          kind: ServingRuntime
          jsonPointers:
            - /status
        - group: llamastack.io
          kind: LlamaStackDistribution
          jsonPointers:
            - /status
            - /metadata/annotations
        - group: maas.opendatahub.io
          kind: MaaSModelRef
          jsonPointers:
            - /status
            - /metadata/finalizers
        - group: maas.opendatahub.io
          kind: MaaSSubscription
          jsonPointers:
            - /status
        - group: maas.opendatahub.io
          kind: MaaSAuthPolicy
          jsonPointers:
            - /status
            - /metadata/finalizers
        - group: route.openshift.io
          kind: Route
          jsonPointers:
            - /spec/host
            - /status
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 60s
            maxDuration: 10m0s
            factor: 2
