apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-memory-patcher
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-memory-patcher
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ai-gateway-operator", "llm-d-batch-gateway-operator"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-memory-patcher
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: gateway-memory-patcher
    namespace: redhat-ods-applications
roleRef:
  kind: Role
  name: gateway-memory-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-memory-override
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: gateway-memory-patcher
      restartPolicy: Never
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli:v4.18
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Patching ai-gateway-operator memory to 1Gi..."
              oc patch deployment ai-gateway-operator -n redhat-ods-applications \
                --type=json \
                -p '[{"op":"replace","path":"/spec/template/spec/containers/0/resources/limits/memory","value":"1Gi"}]' 2>/dev/null || true
              echo "Patching llm-d-batch-gateway-operator memory to 512Mi..."
              oc patch deployment llm-d-batch-gateway-operator -n redhat-ods-applications \
                --type=json \
                -p '[{"op":"replace","path":"/spec/template/spec/containers/0/resources/limits/memory","value":"512Mi"}]' 2>/dev/null || true
              echo "Done."
          resources:
            limits:
              memory: 64Mi
              cpu: 100m
            requests:
              memory: 32Mi
              cpu: 50m
