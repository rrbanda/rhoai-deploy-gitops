apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: maas-db
  labels:
    app: postgresql
    app.kubernetes.io/part-of: maas
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
