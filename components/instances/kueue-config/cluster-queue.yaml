apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: training-cluster-queue
spec:
  queueingStrategy: BestEffortFIFO
  stopPolicy: None
  namespaceSelector: {}
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
    borrowWithinCohort:
      policy: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: default-gpu
          resources:
            - name: "cpu"
              nominalQuota: "48"
            - name: "memory"
              nominalQuota: "192Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "1"
