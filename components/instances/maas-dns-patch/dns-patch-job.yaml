apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-dns-patch-sa
  namespace: redhat-ods-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-dns-patch
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-dns-patch
subjects:
  - kind: ServiceAccount
    name: maas-dns-patch-sa
    namespace: redhat-ods-applications
roleRef:
  kind: ClusterRole
  name: maas-dns-patch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-api-dns-patch
  namespace: redhat-ods-applications
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: maas-dns-patch-sa
          restartPolicy: OnFailure
          containers:
            - name: patch
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  GATEWAY_SVC="maas-default-gateway-data-science-gateway-class"
                  GATEWAY_NS="openshift-ingress"
                  MAAS_API_NS="redhat-ods-applications"

                  GATEWAY_IP=$(oc get svc "$GATEWAY_SVC" -n "$GATEWAY_NS" -o jsonpath='{.spec.clusterIP}')
                  if [ -z "$GATEWAY_IP" ]; then
                    echo "ERROR: Could not resolve gateway ClusterIP"
                    exit 1
                  fi
                  echo "Gateway ClusterIP: $GATEWAY_IP"

                  ELB_HOSTNAME=$(oc get svc "$GATEWAY_SVC" -n "$GATEWAY_NS" \
                    -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
                  if [ -z "$ELB_HOSTNAME" ]; then
                    echo "ERROR: Could not resolve ELB hostname"
                    exit 1
                  fi
                  echo "ELB hostname: $ELB_HOSTNAME"

                  CURRENT=$(oc get deployment maas-api -n "$MAAS_API_NS" \
                    -o jsonpath='{.spec.template.spec.hostAliases[0].ip}' 2>/dev/null || true)

                  if [ "$CURRENT" = "$GATEWAY_IP" ]; then
                    echo "hostAliases already configured correctly"
                    exit 0
                  fi

                  echo "Patching maas-api deployment..."
                  oc patch deployment maas-api -n "$MAAS_API_NS" --type=json \
                    -p="[{
                      \"op\": \"add\",
                      \"path\": \"/spec/template/spec/hostAliases\",
                      \"value\": [{
                        \"ip\": \"$GATEWAY_IP\",
                        \"hostnames\": [\"$ELB_HOSTNAME\"]
                      }]
                    }]"

                  echo "Waiting for rollout..."
                  oc rollout status deployment/maas-api -n "$MAAS_API_NS" --timeout=120s
                  echo "Done - maas-api can now resolve $ELB_HOSTNAME -> $GATEWAY_IP"
