apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: cpu-standard
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  identifiers:
    - displayName: "CPU"
      identifier: cpu
      resourceType: CPU
      defaultCount: 4
      minCount: 1
      maxCount: 8
    - displayName: "Memory"
      identifier: memory
      resourceType: Memory
      defaultCount: 16Gi
      minCount: 4Gi
      maxCount: 32Gi
  scheduling:
    type: Queue
    kueue:
      localQueueName: default
