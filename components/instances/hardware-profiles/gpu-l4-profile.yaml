apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-nvidia-l4
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  identifiers:
    - displayName: "NVIDIA L4 GPU"
      identifier: nvidia.com/gpu
      resourceType: Accelerator
      defaultCount: 1
      minCount: 1
      maxCount: 1
    - displayName: "CPU"
      identifier: cpu
      resourceType: CPU
      defaultCount: 8
      minCount: 4
      maxCount: 16
    - displayName: "Memory"
      identifier: memory
      resourceType: Memory
      defaultCount: 32Gi
      minCount: 16Gi
      maxCount: 64Gi
  scheduling:
    type: Node
    node:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
