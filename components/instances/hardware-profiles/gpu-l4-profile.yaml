apiVersion: dashboard.opendatahub.io/v1alpha1
kind: HardwareProfile
metadata:
  name: gpu-nvidia-l4
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  displayName: "NVIDIA L4 (24GB)"
  description: "NVIDIA L4 Ada Lovelace GPU - 24GB VRAM, suitable for inference and fine-tuning"
  enabled: true
  identifiers:
    - displayName: "NVIDIA L4 GPU"
      identifier: nvidia.com/gpu
      defaultCount: 1
      minCount: 1
      maxCount: 1
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-L4
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
