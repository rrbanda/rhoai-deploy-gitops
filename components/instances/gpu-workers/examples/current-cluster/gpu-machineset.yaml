# ============================================================
# EXAMPLE ONLY — This MachineSet is specific to a single cluster.
# CUSTOMIZE THIS: Replace the infra ID (cluster-4l6x6-2qdmp),
# AMI, subnet, zone, and instance type for your environment.
# See docs/capabilities/gpu-workers.md for guidance.
# ============================================================
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: cluster-4l6x6-2qdmp-worker-gpu-us-east-2b
  namespace: openshift-machine-api
  labels:
    agnosticd.redhat.com/machineset-group: worker-gpu
    machine.openshift.io/cluster-api-cluster: cluster-4l6x6-2qdmp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64
    machine.openshift.io/GPU: "1"
    machine.openshift.io/memoryMb: "16384"
    machine.openshift.io/vCPU: "4"
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: cluster-4l6x6-2qdmp
      machine.openshift.io/cluster-api-machine-role: worker-gpu
      machine.openshift.io/cluster-api-machine-type: worker-gpu
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: cluster-4l6x6-2qdmp
        machine.openshift.io/cluster-api-machine-role: worker-gpu
        machine.openshift.io/cluster-api-machine-type: worker-gpu
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          node-role.kubernetes.io/worker-gpu: ""
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          ami:
            id: ami-013d3e08f54685ee6
          blockDevices:
            - ebs:
                encrypted: true
                iops: 0
                kmsKey:
                  arn: ""
                volumeSize: 120
                volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: cluster-4l6x6-2qdmp-worker-profile
          instanceType: g6e.xlarge
          placement:
            availabilityZone: us-east-2b
            region: us-east-2
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - cluster-4l6x6-2qdmp-worker-sg
          subnet:
            filters:
              - name: tag:Name
                values:
                  - cluster-4l6x6-2qdmp-private-us-east-2b
          tags:
            - name: kubernetes.io/cluster/cluster-4l6x6-2qdmp
              value: owned
          userDataSecret:
            name: worker-user-data
      taints:
        - effect: NoSchedule
          key: nvidia.com/gpu
          value: "True"
