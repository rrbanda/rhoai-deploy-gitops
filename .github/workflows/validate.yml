name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kustomize-build:
    name: Kustomize Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay:
          - clusters/overlays/dev
          - components/instances/rhoai-instance/overlays/minimal
          - components/instances/rhoai-instance/overlays/serving
          - components/instances/rhoai-instance/overlays/training
          - components/instances/rhoai-instance/overlays/full
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build ${{ matrix.overlay }}
        run: kustomize build ${{ matrix.overlay }}

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            components/ clusters/ bootstrap/

  no-hardcoded-values:
    name: Check Portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded cluster IDs
        run: |
          # Fail if any file (outside examples/) contains likely cluster-specific values
          if grep -r --include="*.yaml" --include="*.yml" \
            -E "cluster-[a-z0-9]{5}-[a-z0-9]{5}" \
            --exclude-dir="examples" \
            components/ clusters/; then
            echo "ERROR: Found hardcoded cluster infrastructure IDs!"
            echo "Move cluster-specific files to examples/ directory."
            exit 1
          fi
          echo "No hardcoded cluster IDs found."
