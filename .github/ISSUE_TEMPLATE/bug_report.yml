name: Bug Report
description: Report a problem with the GitOps deployment
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the deployment is affected?
      options:
        - ArgoCD / ApplicationSets
        - RHOAI Operator
        - DataScienceCluster (DSC)
        - GPU Infrastructure (NFD, GPU Operator)
        - Kueue / Scheduling
        - KServe / Model Serving
        - Training (Ray, PyTorch)
        - MaaS / AI Gateway
        - Dashboard
        - Other
    validations:
      required: true

  - type: input
    id: rhoai-version
    attributes:
      label: RHOAI Version
      description: "e.g., 3.5 EA2, 3.4 GA"
      placeholder: "3.5 EA2"
    validations:
      required: true

  - type: input
    id: ocp-version
    attributes:
      label: OpenShift Version
      placeholder: "4.18.21"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps to reproduce the issue.
      value: |
        1.
        2.
        3.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: |
        Include output from:
        - `oc get datasciencecluster default-dsc -o yaml`
        - `oc get applications.argoproj.io -n openshift-gitops`
        - Any pod logs showing errors
      render: shell
