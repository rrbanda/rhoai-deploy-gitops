site_name: RHOAI GitOps Deploy
site_description: Deploy Red Hat OpenShift AI on OpenShift using GitOps -- learn the concepts, understand the architecture, and deploy with confidence
site_url: https://rrbanda.github.io/rhoai-deploy-gitops/
repo_url: https://github.com/rrbanda/rhoai-deploy-gitops
repo_name: rrbanda/rhoai-deploy-gitops

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
    - concepts/index.md
    - What is GitOps?: concepts/gitops-fundamentals.md
    - App-of-Apps Pattern: concepts/app-of-apps.md
    - Kustomize and Overlays: concepts/kustomize-overlays.md
    - GPU Scheduling: concepts/gpu-scheduling.md
    - RHOAI Architecture: concepts/rhoai-architecture.md
  - Getting Started:
    - Quick Start: quickstart.md
    - Configuration: configuration.md
    - Upgrading: upgrading.md
  - Architecture: architecture.md
  - Capabilities:
    - capabilities/index.md
    - Model Serving (KServe): capabilities/model-serving.md
    - Batch Inference: capabilities/batch-inference.md
    - Distributed Inference: capabilities/distributed-inference.md
    - ModelMesh: capabilities/modelmesh.md
    - Training: capabilities/training.md
    - Pipelines: capabilities/pipelines.md
    - Workbenches: capabilities/workbenches.md
    - Model Registry: capabilities/model-registry.md
    - Hardware Profiles: capabilities/hardware-profiles.md
    - Models-as-a-Service: capabilities/maas.md
    - GPU Infrastructure: capabilities/gpu-infrastructure.md
    - Kueue: capabilities/kueue.md
    - MLflow: capabilities/mlflow.md
  - Use Cases:
    - usecases/index.md
    - GenAI Toolbox: usecases/genai-toolbox.md
  - Reference:
    - reference/index.md
    - ArgoCD Applications: reference/argocd-apps.md
    - Sync Configuration: reference/sync-config.md
    - Troubleshooting: reference/troubleshooting.md
    - Teardown: reference/teardown.md
    - Known Issues: reference/known-issues.md
