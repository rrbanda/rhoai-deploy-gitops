apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-platform
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
    targetRevision: helm-deploy-v3.4
    path: helm-deploy/chart
    helm:
      releaseName: rhoai
      skipSchemaValidation: true
      valuesObject:
        skipCrdCheck: true
        components:
          dashboard:
            dsc:
              managementState: Managed
          kserve:
            dependencies:
              certManager: true
              leaderWorkerSet: true
              jobSet: true
              rhcl: true
              customMetricsAutoscaler: false
            dsc:
              managementState: Managed
              nim:
                managementState: Managed
              wva:
                managementState: Managed
            gateway:
              create: true
              name: openshift-ai-inference
              namespace: openshift-ingress
              labels:
                istio.io/rev: openshift-gateway
              spec:
                gatewayClassName: openshift-ai-inference
                listeners:
                - name: https
                  port: 443
                  protocol: HTTPS
                  allowedRoutes:
                    namespaces:
                      from: All
          aigateway:
            dsc:
              managementState: Managed
              modelsAsAService:
                managementState: Managed
              batchGateway:
                managementState: Managed
            modelsAsAService:
              gateway:
                create: true
                name: maas-default-gateway
                namespace: openshift-ingress
                annotations:
                  security.opendatahub.io/authorino-tls-bootstrap: 'true'
                  opendatahub.io/managed: 'false'
                spec:
                  gatewayClassName: maas-gateway-class
                  listeners:
                  - name: https
                    port: 443
                    protocol: HTTPS
                    allowedRoutes:
                      namespaces:
                        from: All
          aipipelines:
            dsc:
              managementState: Managed
              argoWorkflowsControllers:
                managementState: Managed
          kueue:
            dsc:
              managementState: Managed
          ray:
            dsc:
              managementState: Managed
          trainer:
            dsc:
              managementState: Managed
          trainingoperator:
            dsc:
              managementState: Managed
          workbenches:
            dsc:
              managementState: Managed
          modelregistry:
            dsc:
              managementState: Managed
          trustyai:
            dsc:
              managementState: Managed
          mlflowoperator:
            dsc:
              managementState: Managed
          feastoperator:
            dsc:
              managementState: Managed
          ogx:
            dsc:
              managementState: Managed
          sparkoperator:
            dsc:
              managementState: Managed
          mcplifecycleoperator:
            dsc:
              managementState: Managed
        services:
          monitoring:
            dsci:
              managementState: Managed

        dependencies:
          rhcl:
            config:
              tlsEnabled: true
        olm:
          source: REPLACE_WITH_MIRRORED_CATALOG_NAME
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - ServerSideApply=true
