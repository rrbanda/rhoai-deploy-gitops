apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-platform
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  source:
    repoURL: https://github.com/rrbanda/rhoai-deploy-gitops.git
    targetRevision: helm-deploy-v3.4
    path: helm-deploy/chart
    helm:
      releaseName: rhoai
      skipSchemaValidation: true
      valuesObject:
        skipCrdCheck: true
        operator:
          type: rhoai
        components:
          dashboard:
            dsc:
              managementState: Managed
          kserve:
            dependencies:
              certManager: true
              leaderWorkerSet: true
              jobSet: true
              rhcl: true
              customMetricsAutoscaler: false
            dsc:
              managementState: Managed
              nim:
                managementState: Managed
              modelsAsService:
                managementState: Managed
              wva:
                managementState: Managed
              rawDeploymentServiceConfig: Headless
            gateway:
              spec:
                gatewayClassName: openshift-ai-inference
                listeners:
                - name: https
                  port: 443
                  protocol: HTTPS
                  allowedRoutes:
                    namespaces:
                      from: All
            modelsAsService:
              gatewayClass:
                create: true
                name: maas-gateway-class
                spec:
                  controllerName: openshift.io/gateway-controller/v1
              gateway:
                create: true
                name: maas-default-gateway
                namespace: openshift-ingress
                annotations:
                  security.opendatahub.io/authorino-tls-bootstrap: 'true'
                  opendatahub.io/managed: 'false'
                spec:
                  gatewayClassName: maas-gateway-class
                  listeners:
                  - name: https
                    port: 443
                    protocol: HTTPS
                    allowedRoutes:
                      namespaces:
                        from: All
          aipipelines:
            dsc:
              managementState: Managed
          kueue:
            dependencies:
              certManager: true
              kueue: true
            dsc:
              managementState: Unmanaged
              defaultLocalQueueName: default
              defaultClusterQueueName: default
          ray:
            dsc:
              managementState: Managed
          trainer:
            dsc:
              managementState: Managed
          trainingoperator:
            dsc:
              managementState: Managed
          workbenches:
            dsc:
              managementState: Managed
          modelregistry:
            dsc:
              managementState: Managed
          trustyai:
            dsc:
              managementState: Managed
              eval:
                lmeval:
                  permitCodeExecution: deny
                  permitOnline: deny
          mlflowoperator:
            dsc:
              managementState: Managed
          feastoperator:
            dsc:
              managementState: Managed
          llamastackoperator:
            dsc:
              managementState: Removed
        services:
          monitoring:
            dsci:
              managementState: Managed
        dependencies:
          kueue:
            config:
              spec:
                managementState: Managed
                config:
                  integrations:
                    frameworks:
                    - Deployment
                    - Pod
                    - PyTorchJob
                    - RayCluster
                    - RayJob
                    - StatefulSet
                    - TrainJob
        olm:
          source: REPLACE_WITH_MIRRORED_CATALOG_NAME
  destination:
    server: https://kubernetes.default.svc
    namespace: rhoai-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - ServerSideApply=true
