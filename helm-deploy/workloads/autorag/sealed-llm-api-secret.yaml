# Sealed version of the LLM API key secret.
# Generate with:
#   kubeseal --format yaml --controller-namespace sealed-secrets \
#     < templates/llm-api-secret.yaml.template \
#     > sealed-llm-api-secret.yaml
#
# The Sealed Secrets controller decrypts this into a Secret named "llm-api-secret"
# in the "autorag" namespace, which OGXServer references.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: llm-api-secret
  namespace: autorag
spec:
  encryptedData: {}
  template:
    metadata:
      name: llm-api-secret
      namespace: autorag
    type: Opaque
