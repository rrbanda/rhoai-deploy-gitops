# Sealed version of the S3 connection secret.
# Generate with:
#   kubeseal --format yaml --controller-namespace sealed-secrets \
#     < templates/s3-connection-secret.yaml.template \
#     > sealed-s3-connection-secret.yaml
#
# The Sealed Secrets controller decrypts this into a Secret named
# "autorag-s3-connection" in the "autorag" namespace, which DSPA references.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: autorag-s3-connection
  namespace: autorag
spec:
  encryptedData: {}
  template:
    metadata:
      name: autorag-s3-connection
      namespace: autorag
    type: Opaque
