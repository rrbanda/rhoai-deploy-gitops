# RHOAI 3.4 -- Full platform, all components enabled.
skipCrdCheck: true

operator:
  type: rhoai

components:
  dashboard:
    dsc:
      managementState: Managed

  kserve:
    dependencies:
      certManager: true
      leaderWorkerSet: true
      jobSet: true
      rhcl: true
      customMetricsAutoscaler: false
    dsc:
      managementState: Managed
      nim:
        managementState: Managed
      modelsAsService:
        managementState: Managed
      wva:
        managementState: Managed
      rawDeploymentServiceConfig: Headless
    gateway:
      spec:
        gatewayClassName: openshift-ai-inference
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
    modelsAsService:
      gatewayClass:
        create: true
        name: maas-gateway-class
        spec:
          controllerName: "openshift.io/gateway-controller/v1"
      gateway:
        create: true
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          security.opendatahub.io/authorino-tls-bootstrap: "true"
          opendatahub.io/managed: "false"
        spec:
          gatewayClassName: maas-gateway-class
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: All

  aipipelines:
    dsc:
      managementState: Managed
      argoWorkflowsControllers:
        managementState: Managed

  kueue:
    dependencies:
      certManager: true
      kueue: true
    dsc:
      managementState: Unmanaged
      defaultLocalQueueName: default
      defaultClusterQueueName: default

  ray:
    dsc:
      managementState: Managed

  trainer:
    dsc:
      managementState: Managed

  trainingoperator:
    dsc:
      managementState: Managed

  workbenches:
    dsc:
      managementState: Managed

  modelregistry:
    dsc:
      managementState: Managed

  trustyai:
    dsc:
      managementState: Managed
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny

  mlflowoperator:
    dsc:
      managementState: Managed

  feastoperator:
    dsc:
      managementState: Managed

  llamastackoperator:
    dsc:
      managementState: Managed

  mcplifecycleoperator:
    dsc:
      managementState: Managed

services:
  monitoring:
    dsci:
      managementState: Managed

dependencies:
  kueue:
    config:
      spec:
        managementState: Managed
        config:
          integrations:
            frameworks:
              - Deployment
              - Pod
              - PyTorchJob
              - RayCluster
              - RayJob
              - StatefulSet
              - TrainJob
