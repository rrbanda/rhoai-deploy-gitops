# RHOAI 3.4 -- Inference-only (RHAII profile).
# Deploys: KServe + cert-manager, RHCL/Kuadrant, LeaderWorkerSet.
skipCrdCheck: true
profile: rhaii

operator:
  type: rhoai

components:
  kserve:
    gateway:
      spec:
        gatewayClassName: openshift-ai-inference
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
