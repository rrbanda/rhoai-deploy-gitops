apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gemma4-e4b
  labels:
    app.kubernetes.io/name: gemma4-e4b
    app.kubernetes.io/component: inference-service
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/model-type: generative
    openshift.io/display-name: Google Gemma 4 E4B-IT
    openshift.io/description: "Google Gemma 4 E4B instruction-tuned (4B params, multimodal)"
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/stop: "false"
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ""
      runtime: gemma4-e4b
      storageUri: "pvc://model-weights/gemma-4-4b-it"
      args:
        - --dtype=bfloat16
        - --max-model-len=8192
        - --gpu-memory-utilization=0.90
      resources:
        requests:
          cpu: "1"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "24Gi"
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
