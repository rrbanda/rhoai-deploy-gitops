apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma4-e4b
  labels:
    app.kubernetes.io/name: download-gemma4-e4b
    app.kubernetes.io/component: model-download
    app.kubernetes.io/part-of: gemma4-e4b
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: download-gemma4-e4b
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: OnFailure
      containers:
        - name: download
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - bash
            - -ec
            - |
              echo "=== Downloading Gemma 4 E4B-IT ==="
              df -h /models
              pip install -q huggingface_hub
              python3 << 'PYEOF'
              from huggingface_hub import snapshot_download
              import os
              target = '/models/gemma-4-4b-it'
              marker = os.path.join(target, '.download_complete')
              if os.path.exists(marker):
                  print('Model already downloaded (marker found). Skipping.')
                  exit(0)
              snapshot_download(
                  repo_id='google/gemma-4-4b-it',
                  local_dir=target,
                  ignore_patterns=['*.gguf', '*.bin', 'original/*'],
              )
              open(marker, 'w').write('ok')
              print('Download complete.')
              PYEOF
              echo ""
              ls -lh /models/gemma-4-4b-it/
              df -h /models
              echo "DONE"
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-weights
