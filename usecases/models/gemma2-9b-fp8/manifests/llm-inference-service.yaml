apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: gemma2-9b-fp8
  labels:
    app.kubernetes.io/name: gemma2-9b-fp8
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/model-type: generative
    openshift.io/display-name: "Google Gemma 2 9B Instruct (FP8)"
    openshift.io/description: "Red Hat AI validated Gemma 2 9B instruction-tuned, FP8 quantized"
    alpha.maas.opendatahub.io/tiers: '[]'
spec:
  model:
    name: gemma2-9b-fp8
    uri: oci://registry.redhat.io/rhelai1/modelcar-gemma-2-9b-it-fp8:1.5
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: "--chat-template /etc/chat-template/template.jinja"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "3"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: chat-template
            mountPath: /etc/chat-template
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    volumes:
      - name: chat-template
        configMap:
          name: gemma2-chat-template
