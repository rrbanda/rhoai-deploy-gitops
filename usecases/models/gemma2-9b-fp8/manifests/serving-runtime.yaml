apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: gemma2-9b-fp8
  labels:
    app.kubernetes.io/name: gemma2-9b-fp8
    app.kubernetes.io/component: serving-runtime
  annotations:
    opendatahub.io/template-name: vllm-cuda-runtime-template
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ad06abf3bb5235ebb5b2df84cd1b9fd09e823f0ff2eebfc82bb4590275ccfe0b
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
          name: http
