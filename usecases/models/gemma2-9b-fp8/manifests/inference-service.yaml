apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gemma2-9b-fp8
  labels:
    app.kubernetes.io/name: gemma2-9b-fp8
    app.kubernetes.io/component: inference-service
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/model-type: generative
    openshift.io/display-name: Google Gemma 2 9B Instruct (FP8)
    openshift.io/description: "Red Hat AI validated Gemma 2 9B instruction-tuned, FP8 quantized"
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/stop: "false"
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ""
      runtime: gemma2-9b-fp8
      storageUri: oci://registry.redhat.io/rhelai1/modelcar-gemma-2-9b-it-fp8:1.5
      args:
        - --dtype=auto
        - --max-model-len=4096
        - --gpu-memory-utilization=0.90
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "3"
          memory: "8Gi"
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
