apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gemini-2-0-flash
  labels:
    app.kubernetes.io/name: gemini-external
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Supported providers: openai, anthropic, azure-openai, vertex-openai, bedrock-openai.
  # For Google Gemini, the production-supported path is vertex-openai with
  # endpoint: <region>-aiplatform.googleapis.com and OAuth2 credentials.
  # Using openai here for the direct generativelanguage.googleapis.com endpoint
  # (Gemini's OpenAI-compatible layer) as a proof-of-concept.
  provider: openai
  endpoint: generativelanguage.googleapis.com
  targetModel: gemini-2.0-flash
  credentialRef:
    name: gemini-api-key
