apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: ogx-external-test
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    openshift.io/display-name: "OGX External Test (No GPU)"
spec:
  replicas: 1
  network:
    exposeRoute: true
    allowedFrom:
      namespaces:
        - ogx-external-test
        - models-as-a-service
  server:
    containerSpec:
      name: ogx-server
      port: 8321
      command:
        - /bin/sh
        - -c
        - llama stack run /etc/llama-stack/config.yaml
      env:
        - name: EXTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: ogx-external-credentials
              key: api-key
        - name: EXTERNAL_BASE_URL
          valueFrom:
            secretKeyRef:
              name: ogx-external-credentials
              key: base-url
        - name: MILVUS_DB_PATH
          value: "~/.llama/milvus.db"
        - name: LLAMA_STACK_CONFIG_DIR
          value: "/opt/app-root/src/.llama/distributions/rh/"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi
    distribution:
      name: rh-dev
    userConfig:
      configMapName: ogx-external-config
