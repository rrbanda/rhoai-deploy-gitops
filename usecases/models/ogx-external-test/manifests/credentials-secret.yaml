apiVersion: v1
kind: Secret
metadata:
  name: ogx-external-credentials
  labels:
    app.kubernetes.io/name: ogx-external-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  # Replace with your external provider credentials.
  # For Groq:      https://api.groq.com/openai/v1
  # For Together:  https://api.together.xyz/v1
  # For OpenAI:    https://api.openai.com/v1
  # For Fireworks: https://api.fireworks.ai/inference/v1
  # For any OpenAI-compatible endpoint, set the base URL here.
  api-key: "${EXTERNAL_API_KEY}"
  base-url: "https://api.groq.com/openai/v1"
