apiVersion: v1
kind: Service
metadata:
  name: guardrails-gateway
  namespace: ai-guardrails
  labels:
    app: guardrails-gateway
    app.kubernetes.io/part-of: guardrails-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: guardrails-gateway
  ports:
    - port: 8090
      targetPort: 8090
      name: http
