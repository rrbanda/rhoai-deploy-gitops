# ============================================================
# CUSTOMIZE THIS: Replace cluster-specific hostnames in the
# request header filter below with your inference endpoint.
# ============================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multi-cluster-inference
  namespace: ai-gateway
  labels:
    app.kubernetes.io/part-of: ai-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: ai-inference-gateway
      namespace: ai-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: CHANGE_ME.apps.CHANGE_ME_CLUSTER_DOMAIN
      backendRefs:
        - name: inference-backend
          port: 443
