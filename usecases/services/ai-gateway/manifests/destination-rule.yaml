# ============================================================
# CUSTOMIZE THIS: Replace the host below with your cluster's
# inference service route hostname.
# ============================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: remote-inference-tls
  namespace: ai-gateway
  labels:
    app.kubernetes.io/part-of: ai-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  host: CHANGE_ME.apps.CHANGE_ME_CLUSTER_DOMAIN
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
